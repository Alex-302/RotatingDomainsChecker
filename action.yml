name: 'Rotating Domains Checker'
description: 'Automatically check and update rotating domains in ad blocking filters'
author: 'Alex-302'
branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  config-path:
    description: 'Path to configuration file'
    required: false
    default: './config.yml'
    type: string
  mode:
    description: 'Run mode: prod_live, prod_dry, test_live, test_dry'
    required: false
    default: ''
    type: choice
    options:
      - ''
      - 'prod_live'
      - 'prod_dry'
      - 'test_live'
      - 'test_dry'
  filters-path:
    description: 'Path to filters directory'
    required: false
    default: './'
    type: string

outputs:
  updated-count:
    description: 'Number of domains updated'
  commit-sha:
    description: 'SHA of the commit made'
  pr-number:
    description: 'Pull request number (if created)'

runs:
  using: 'node24'
  main: 'dist/index.js'
