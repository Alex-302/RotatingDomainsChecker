# Example workflow for local Rotating Domains Checker script testing
# Use this when: Running in RotatingDomainsChecker repository itself for testing/debugging
# No cloning needed - uses local code

name: Rotating Domains Checker (Local Testing)

on:
  # Manual run only (for testing)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'test_dry'
        type: choice
        options:
          - ''              # Use config.yml setting
          - 'prod_live'     # Production mode with changes
          - 'prod_dry'      # Production mode without changes (git operations simulation)
          - 'test_live'     # Test directory with changes
          - 'test_dry'      # Test directory without changes (git operations simulation)

      config-path:
        description: 'Path to configuration file'
        required: false
        default: './config.yml'
        type: string

      filters-path:
        description: 'Path to filters directory'
        required: false
        default: './'
        type: string

jobs:
  check-domains:
    name: Rotating Domains Checker
    runs-on: ubuntu-latest

    permissions:
      contents: write          # Required for commits
      pull-requests: write     # Required for PR creation
      actions: read            # Required for reading workflow info

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build
        run: npm run build

      - name: 🚀 Run Rotating Domains Checker
        run: |
          # Configure git user for commits
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Run the checker (code is already in current directory)
          node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CONFIG_PATH: ${{ github.event.inputs.config-path || './config.yml' }}
          INPUT_MODE: ${{ github.event.inputs.mode || '' }}
          INPUT_FILTERS_PATH: ${{ github.event.inputs.filters-path || './' }}

      - name: 📋 Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotating-domains-checker-log
          path: logs/rotating-domains-checker.log
          retention-days: 7
